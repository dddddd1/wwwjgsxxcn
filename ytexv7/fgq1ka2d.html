<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全保护</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            overflow: hidden;
            position: relative;
        }

        /* 流畅渐变背景 */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #0a0a0a, #16213e);
            z-index: 0;
        }
        
        /* 网格（轻量化）*/
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 1;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }
        
        /* 文字（流畅不卡）*/
        .text {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(45deg, #00ffff, #00ff9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: blink 2.2s infinite alternate;
            text-shadow: 0 0 15px rgba(0,255,255,0.5);
        }

        @keyframes blink {
            0% { opacity:1; transform: scale(1); }
            100% { opacity:0.8; transform: scale(1.02); }
        }

        /* 响应式 */
        @media (max-width:768px) {
            .text { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="text">倒计时21天</div>
</div>

</body>
</html>
